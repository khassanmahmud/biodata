AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM role that GitHub Actions assumes (via OIDC, no stored keys) to deploy the
  about-me site stack. Deploy once by hand with an admin profile:

    aws cloudformation deploy --template-file infra/github-oidc.yaml \
      --stack-name about-me-github-oidc --capabilities CAPABILITY_NAMED_IAM

  Then save the RoleArn output as the GitHub repo secret AWS_DEPLOY_ROLE_ARN.

Parameters:
  GitHubRepo:
    Type: String
    Default: khassanmahmud/about-me
    Description: owner/repo allowed to assume the role
  DeployBranch:
    Type: String
    Default: static-for-s3
    Description: Only workflows running on this branch can assume the role
  SiteStackName:
    Type: String
    Default: about-me
    Description: Name of the site stack deployed by infra/deploy.sh
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if this account already has the token.actions.githubusercontent.com provider

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${SiteStackName}-github-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/${DeployBranch}"
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SiteStack
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${SiteStackName}/*"
              - Sid: ChangeSets
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource: "*"
              # CloudFormation names the bucket "<stack>-sitebucket-<suffix>".
              - Sid: SiteBucket
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${SiteStackName}-sitebucket-*"
                  - !Sub "arn:${AWS::Partition}:s3:::${SiteStackName}-sitebucket-*/*"
              - Sid: CloudFront
                Effect: Allow
                Action:
                  - cloudfront:*Distribution*
                  - cloudfront:*OriginAccessControl*
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:ListInvalidations
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                Resource: "*"

Outputs:
  RoleArn:
    Description: Save as the GitHub secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
